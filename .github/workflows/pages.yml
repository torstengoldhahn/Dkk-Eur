name: Pages

# Stellt GitHub Pages auf den Branch, der gerade gepusht wurde.
# Das entspricht „Settings → Pages → Source: Deploy from a branch“,
# nur ohne Klicken. Das Veröffentlichen übernimmt danach GitHub selbst.

on:
  push:
    branches:
      - main
      - claude/dictation-program-automation-vms7dj
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  quelle-setzen:
    runs-on: ubuntu-latest
    steps:
      - name: Pages auf diesen Branch stellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "Gewünschte Quelle: $BRANCH (Wurzelverzeichnis)"

          if gh api --method POST "repos/$REPO/pages" \
               -f "source[branch]=$BRANCH" -f "source[path]=/" >/dev/null 2>&1; then
            echo "Pages war noch aus und ist jetzt eingerichtet."
          else
            echo "Pages läuft bereits — aktualisiere nur die Quelle."
            gh api --method PUT "repos/$REPO/pages" \
              -f "source[branch]=$BRANCH" -f "source[path]=/"
          fi

          gh api "repos/$REPO/pages" \
            --jq '"Adresse: \(.html_url)\nStatus:  \(.status)\nQuelle:  \(.source.branch)\(.source.path)"'
